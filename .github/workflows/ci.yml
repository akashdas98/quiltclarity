name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check durable agent context
        shell: pwsh
        run: |
          ./scripts/check_context.ps1
          ./scripts/test_context.ps1

      - name: Verify types, style, tests, and static build
        run: npm run verify
